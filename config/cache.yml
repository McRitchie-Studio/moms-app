# Solid Cache settings. Solid Cache backs one store: the magic-link rate-limit
# counters (ClosedSignup::MagicLinkRequest::STORE). Rails.cache is a separate
# store (config/environments/*.rb) and is not configured here.
#
# No `database:` key, so the table lives in the primary database
# (db/migrate/*_create_solid_cache_entries.rb) and shares its connection pool:
# every web process, dyno and deploy reads and writes the same rows.
default: &default
  store_options:
    # A counter's own expiry is its 15-minute window; a day is far beyond it, so
    # trimming by age only clears rows for addresses that stopped asking.
    max_age: <%= 1.day.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

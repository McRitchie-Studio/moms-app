test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# ACTIVE STORAGE'S ONE CLOUD STORE: CLOUDFLARE R2. `amazon` is the name every
# blob row records, so the service keeps that name; it has resolved to R2 alone
# since 2026-10-03 and AWS S3 was retired on 2026-10-10. The rules it reads
# (accepted ACTIVE_STORAGE_BACKEND values, which R2_* variables production must
# hold, which bucket a process owns) live in
# config/initializers/00_storage_backend.rb.
<% StorageBackend.backend! %>
amazon:
  # The engine's S3 service with a three-day grace period on delete: a purge
  # COPIES the object to trash/<utc date>/<epoch ms>/<key> and only then deletes
  # it (Studio::S3::Trash). R2 has no object versioning, so this is the undo;
  # the bucket's lifecycle rule `expire-trash-3d` removes the copy later.
  service: StudioTrashS3
  endpoint: <%= StorageBackend.r2_setting("R2_ENDPOINT") %>
  access_key_id: <%= StorageBackend.r2_setting("R2_ACCESS_KEY_ID") %>
  secret_access_key: <%= StorageBackend.r2_setting("R2_SECRET_ACCESS_KEY") %>
  region: auto
  bucket: <%= StorageBackend.bucket %>
  # Required on R2: Active Storage sends Content-MD5, aws-sdk-s3 >= 1.178 adds a
  # CRC32 by default, and R2 refuses a request carrying both ("You can only
  # specify one non-default checksum at a time", measured 2026-09-28).
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>


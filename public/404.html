<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found · Moms App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.png" type="image/png">
  <!-- The last resort (task apps-adopt-not-found-page; studio-engine
       docs/NOT_FOUND_PAGE.md). The friendly not-found page is the engine's
       Studio::ExceptionsApp, inside this app's layout. This file answers when
       that page cannot render (an old browser allow_browser turns away, a
       redirect, an error), so it stands alone: no script, no stylesheet, no
       font to fetch, only files already in public/. Same words and the same
       data-test hooks as the engine page.
       Moms App's warm pink. The button is the pink deepened so its white label reads (5.2:1).
       Plain colour values, no custom properties, so an old browser reads it. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-color: #FDF6F9;
      color: #5E4A55;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 28rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #F2D9E5;
      border-radius: 1rem;
    }
    img { display: block; width: 4rem; height: 4rem; margin: 0 auto 1.5rem; object-fit: contain; }
    .eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #A8336C;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.75rem; font-weight: 800; line-height: 1.2; color: #2A1620; }
    p.message { margin: 0 0 2rem; font-size: 1rem; }
    a.home {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      background: #B83F7A;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }
    a.home:hover { background: #9E3267; }
    a.home:focus-visible { outline: 2px solid #B83F7A; outline-offset: 3px; }
    @media (min-width: 640px) { a.home { width: auto; } }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1F141A;
        color: #E8D3DD;
      }
      main { background: #2B1C24; border-color: #47303C; }
      .eyebrow { color: #F29AC4; }
      h1 { color: #FFFFFF; }
      a.home { background: #B83F7A; }
      a.home:hover { background: #9E3267; }
      a.home:focus-visible { outline-color: #F29AC4; }
    }
  </style>
</head>
<body data-static-404>
  <main data-test="not-found" aria-labelledby="not-found-title">
    <img src="/logo.png" alt="Moms App" width="64" height="64">
    <p class="eyebrow">404 &middot; Not found</p>
    <h1 id="not-found-title">This page isn’t here</h1>
    <p class="message">The address may be mistyped, or the page may have moved. Head back home and pick up from there.</p>
    <a class="home" href="/" data-test="not-found-home">Back to Moms App</a>
  </main>
</body>
</html>

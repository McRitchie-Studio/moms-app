name: CI

on:
  pull_request:
  # accepted and release are shippable rungs of the release ladder: bin/release
  # prepare refuses to promote a rung CI never builds (it cannot certify it).
  push:
    branches: [ main, release, accepted ]

# One job, and it is a call. The lanes live in the hub's reusable-ci.yml and
# check out this repo, so every script they run is this repo's own
# (.github/scripts/apt-retry included). GitHub names each check
# `ci / <lane>`: `ci / static`, `ci / system`.
#
# - static: brakeman, bundler-audit, importmap audit and rubocop, in one job.
# - system: the unit, integration and system suites in one command. ffmpeg is
#   an app dependency: BookStitcher shells out to it, and book_stitcher_test
#   exercises that real path.
#
# Postgres is the hub mirror's 18 on ghcr.io, production's major (heroku pg:info).
# A non-ghcr name breaks the hub workflow: its service `credentials` evaluate
# to empty strings, which GitHub rejects before the job starts.
# test/lib/ci_workflow_test.rb pins the call and every input.
jobs:
  ci:
    uses: McRitchie-Studio/mcritchie-studio/.github/workflows/reusable-ci.yml@main
    with:
      javascript: false
      island-animator: false
      playwright: false
      rails-shards: false
      await-gem-propagation: false
      postgres-image: ghcr.io/mcritchie-studio/postgres:18
      gem-audit-command: bin/bundler-audit
      importmap-audit-command: bin/importmap audit
      system-packages: libpq-dev libvips ffmpeg
      system-command: bin/rails db:test:prepare test test:system
